<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="icon" href="icons/icon32.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" id="go-home" type="button" title="Home">
        <img src="icons/icon32.png" alt="" width="22" height="22" />
        <span>TodoBox</span>
      </button>
      <div class="topbar-right">
        <span class="folder-pill" id="folder-pill" hidden></span>
        <a class="text-btn" href="https://mail.google.com" title="Gmail">Gmail</a>
        <button class="text-btn" id="toggle-page" type="button">Tasks</button>
        <button class="icon-btn" id="open-settings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.04 7.04 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
        </button>
        <button class="icon-btn" id="toggle-theme" type="button" title="Theme" aria-label="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0 4a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1ZM12 4a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1Zm8 9a1 1 0 0 1-1-1 1 1 0 1 1 2 0 1 1 0 0 1-1 1ZM4 13a1 1 0 0 1-1-1 1 1 0 1 1 2 0 1 1 0 0 1-1 1Zm13.66 6.66a1 1 0 0 1-1.41 0l-.71-.7a1 1 0 1 1 1.41-1.42l.71.71a1 1 0 0 1 0 1.41ZM6.05 7.05a1 1 0 0 1-1.41 0l-.71-.7A1 1 0 0 1 5.34 4.9l.71.71a1 1 0 0 1 0 1.41Zm12.02-2.12a1 1 0 0 1 0 1.41l-.71.71A1 1 0 1 1 15.95 5.6l.71-.7a1 1 0 0 1 1.41 0ZM6.05 16.95a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.42l.71-.7a1 1 0 0 1 1.41 0Z"/></svg>
        </button>
      </div>
    </header>

    <main id="home" class="home">
      <p class="hello" id="hello"></p>
      <h1 class="date-line" id="date-line"></h1>
      <form id="web-search" class="search-wrap" autocomplete="off">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
          <input id="web-q" name="q" type="search" placeholder="Search Google or type a URL" />
        </div>
      </form>

      <section class="today-card" id="today-card">
        <div class="today-head">
          <h2>Today</h2>
          <button class="text-btn" id="home-open-tasks" type="button">Open tasks</button>
        </div>
        <form id="home-quick" class="quick-row">
          <input id="home-quick-input" type="text" placeholder="Add a task — defaults to today" dir="auto" />
          <button type="button" class="hint-open" data-open-hints="home-quick-input" title="Quick add phrases" aria-label="Quick add phrases">?</button>
        </form>
        <ul class="task-list" id="home-today-list"></ul>
      </section>

      <section class="dials">
        <div class="dials-head">
          <h2>Most visited</h2>
        </div>
        <div class="dial-grid" id="topsite-grid"></div>
      </section>

      <section class="dials">
        <div class="dials-head">
          <h2>Shortcuts</h2>
        </div>
        <div class="dial-grid" id="shortcut-grid"></div>
      </section>

      <aside class="notes-rail" id="home-notes">
        <div class="notes-head"><h2>Notes</h2></div>
        <form class="note-add-form">
          <textarea class="note-add" placeholder="Write a note" dir="auto" rows="3"></textarea>
          <button class="primary" type="submit">Add note</button>
        </form>
        <div class="notes-list"></div>
      </aside>
    </main>

    <main id="workspace" class="workspace hidden">
      <aside class="sidebar">
        <nav class="nav" id="smart-nav"></nav>
        <div class="side-block">
          <div class="side-label">Projects</div>
          <div id="project-nav"></div>
          <button class="side-add" id="add-project" type="button">+ New project</button>
        </div>
        <div class="side-block">
          <div class="side-label">Tags</div>
          <div id="tag-nav"></div>
        </div>
      </aside>
      <section class="list-pane">
        <div class="list-head">
          <div>
            <h1 id="list-title">Today</h1>
            <p class="list-sub" id="list-sub"></p>
          </div>
          <div class="list-actions">
            <input id="task-filter" type="search" placeholder="Filter" />
            <select id="priority-filter" aria-label="Priority filter">
              <option value="">All priorities</option>
              <option value="1">P1</option>
              <option value="2">P2</option>
              <option value="3">P3</option>
              <option value="4">P4</option>
            </select>
            <button class="ghost-btn hidden" id="board-toggle" type="button">Board</button>
          </div>
        </div>
        <form id="quick-add" class="quick-row">
          <input id="quick-input" type="text" placeholder="Quick add  ·  Q" dir="auto" />
          <button type="button" class="hint-open" id="quick-hint-open" data-open-hints="quick-input" title="Quick add phrases" aria-label="Quick add phrases">?</button>
        </form>
        <div id="list-body"></div>
      </section>
      <aside class="notes-rail notes-rail-workspace" id="workspace-notes">
        <div class="notes-head"><h2>Notes</h2></div>
        <form class="note-add-form">
          <textarea class="note-add" placeholder="Write a note" dir="auto" rows="3"></textarea>
          <button class="primary" type="submit">Add note</button>
        </form>
        <div class="notes-list"></div>
      </aside>
      <aside class="detail-pane" id="detail-pane"></aside>
    </main>
  </div>

  <div class="drawer hidden" id="settings">
    <div class="drawer-card">
      <div class="drawer-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="close-settings" type="button" aria-label="Close">×</button>
      </div>
      <div class="drawer-body" id="settings-body"></div>
    </div>
  </div>

  <div class="modal hidden" id="modal"></div>
  <div class="toast hidden" id="toast"></div>

  <script src="vendor/sql-wasm.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
